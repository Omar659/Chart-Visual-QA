# Builds the THIN vlm_service/Dockerfile (FROM the prebuilt vlm-base) with the REPO ROOT
# as context (it needs `modeling/` alongside vlm_service/). Invoked by
# scripts/gcloud_deploy_vlm.sh via `gcloud builds submit --config vlm_service/cloudbuild.yaml .`.
# Fast: no apt/pip/model download — just pulls vlm-base (cached) + copies code/adapter.
# _BASE_IMAGE is the Artifact Registry path of vlm-base:latest (see gcloud_deploy_vlm.sh).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - vlm_service/Dockerfile
      - --build-arg=VLM_BASE_IMAGE=${_BASE_IMAGE}
      - -t
      - ${_IMAGE}
      - .
images: ["${_IMAGE}"]
# No model download here (that's baked into vlm-base), so the default 10-min timeout is
# plenty — but the thin image still layers on the ~170 MB adapter + pulls the base to push
# a combined manifest, so keep a small margin.
timeout: "1200s"
