# Load dashboards from a folder baked in via the compose volume.
apiVersion: 1
providers:
  - name: chartqa
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
