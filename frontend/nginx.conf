# nginx serves the built SPA and proxies /api to the backend, so the browser makes
# same-origin requests (no CORS in prod) — mirrors the Vite dev proxy (vite.config.js).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reject oversize uploads at the edge (keep in sync with backend MAX_UPLOAD_MB=10),
    # so a huge body is dropped before it ever streams to Flask.
    client_max_body_size 10m;

    # Baseline security headers (defense-in-depth; the backend also sets these on /api).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # API → backend service on the Docker network.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # survive a cold guard / VLM call
    }

    # SPA fallback: unknown paths return index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
